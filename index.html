<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت بات پیشرفته سعدی کد</title>
    <style>
        :root {
            --primary-bg: #0a0a0a;
            --secondary-bg: #111111;
            --accent-color: #00ff88;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --user-message-bg: #1a3a2a;
            --bot-message-bg: #1a1a2a;
            --hover-color: #00cc6a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }
        
        .header {
            background-color: var(--secondary-bg);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            font-weight: 700;
        }
        
        .logo span {
            font-size: 0.9rem;
            color: var(--text-color);
            opacity: 0.8;
        }
        
        .mode-selector {
            display: flex;
            gap: 10px;
        }
        
        .mode-btn {
            background-color: var(--primary-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .mode-btn.active {
            background-color: var(--accent-color);
            color: var(--primary-bg);
            border-color: var(--accent-color);
        }
        
        .mode-btn:hover:not(.active) {
            background-color: var(--secondary-bg);
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            align-self: flex-end;
            background-color: var(--user-message-bg);
            border-bottom-right-radius: 5px;
        }
        
        .bot-message {
            align-self: flex-start;
            background-color: var(--bot-message-bg);
            border-bottom-left-radius: 5px;
        }
        
        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }
        
        .input-area {
            display: flex;
            padding: 15px 20px;
            background-color: var(--secondary-bg);
            border-top: 1px solid var(--border-color);
        }
        
        .input-area input {
            flex: 1;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 12px 20px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }
        
        .input-area input:focus {
            border-color: var(--accent-color);
        }
        
        .input-area button {
            background-color: var(--accent-color);
            color: var(--primary-bg);
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            margin-right: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        
        .input-area button:hover {
            background-color: var(--hover-color);
        }
        
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: var(--bot-message-bg);
            padding: 12px 18px;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-color);
            opacity: 0.6;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
            opacity: 0.7;
            border-top: 1px solid var(--border-color);
            background-color: var(--secondary-bg);
        }
        
        /* حالت‌های مختلف */
        .copilot-mode .header {
            background: linear-gradient(135deg, var(--secondary-bg) 0%, #0f2a1f 100%);
        }
        
        .gpt4-mode .header {
            background: linear-gradient(135deg, var(--secondary-bg) 0%, #1a1a3a 100%);
        }
        
        /* اسکرول بار سفارشی */
        .chat-area::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-area::-webkit-scrollbar-track {
            background: var(--primary-bg);
        }
        
        .chat-area::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        .chat-area::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }
        
        /* طراحی ریسپانسیو */
        @media (max-width: 768px) {
            .message {
                max-width: 90%;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
            }
            
            .mode-selector {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <div class="logo">
                <h1>چت بات پیشرفته سعدی کد</h1>
                <span>طراحی شده توسط سعدی اسفندیار - ۲۰۲۵</span>
            </div>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="gpt4">GPT-4</button>
                <button class="mode-btn" data-mode="copilot">Copilot</button>
                <button class="mode-btn" data-mode="creative">خلاقانه</button>
                <button class="mode-btn" data-mode="precise">دقیق</button>
            </div>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="message bot-message">
                سلام! من دستیار هوشمند شما هستم. سعدی اسفندیار من را طراحی کرده است. چگونه می‌توانم به شما کمک کنم؟
                <div class="message-time">اکنون</div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="پیام خود را اینجا تایپ کنید...">
            <button id="sendBtn">ارسال</button>
        </div>
        
        <div class="footer">
            طراحی و توسعه توسط تیم سعدی کد - سعدی اسفندیار - ۲۰۲۵
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatArea = document.getElementById('chatArea');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const typingIndicator = document.getElementById('typingIndicator');
            const modeButtons = document.querySelectorAll('.mode-btn');
            const chatContainer = document.querySelector('.chat-container');
            
            let currentMode = 'gpt4';
            let copilotChatId = null;
            
            // تغییر حالت هوش مصنوعی
            modeButtons.forEach(button => {
                button.addEventListener('click', function() {
                    modeButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    currentMode = this.getAttribute('data-mode');
                    
                    // تغییر کلاس برای استایل‌های مختلف
                    chatContainer.className = 'chat-container';
                    chatContainer.classList.add(`${currentMode}-mode`);
                    
                    // پیام تغییر حالت
                    addMessage(`حالت ${getModeName(currentMode)} فعال شد.`, 'bot');
                });
            });
            
            // ارسال پیام با کلیک روی دکمه
            sendBtn.addEventListener('click', sendMessage);
            
            // ارسال پیام با کلید اینتر
            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // تابع ارسال پیام
            function sendMessage() {
                const message = userInput.value.trim();
                if (message === '') return;
                
                // اضافه کردن پیام کاربر
                addMessage(message, 'user');
                userInput.value = '';
                
                // نمایش نشانگر تایپ
                showTypingIndicator();
                
                // ارسال به API مناسب بر اساس حالت
                setTimeout(() => {
                    hideTypingIndicator();
                    
                    if (currentMode === 'copilot') {
                        sendToCopilot(message);
                    } else if (currentMode === 'gpt4') {
                        sendToGPT4(message);
                    } else {
                        // برای حالت‌های دیگر از پاسخ‌های محلی استفاده می‌کنیم
                        generateLocalResponse(message);
                    }
                }, 1000);
            }
            
            // ارسال به Copilot API
            async function sendToCopilot(message) {
                try {
                    // اگر chatId نداریم، یک چت جدید ایجاد می‌کنیم
                    if (!copilotChatId) {
                        const newChatResponse = await fetch('https://api.majidapi.ir/ai/copilot-save/new');
                        const newChatData = await newChatResponse.json();
                        copilotChatId = newChatData.chatId;
                    }
                    
                    // ارسال پیام به Copilot
                    const response = await fetch(`https://api.majidapi.ir/ai/copilot-save?chatId=${copilotChatId}&q=${encodeURIComponent(message)}`);
                    const data = await response.json();
                    
                    // نمایش پاسخ
                    addMessage(data.result || 'پاسخی دریافت نشد.', 'bot');
                } catch (error) {
                    console.error('خطا در ارتباط با Copilot:', error);
                    addMessage('متأسفانه در ارتباط با سرور مشکلی پیش آمده. لطفاً دوباره تلاش کنید.', 'bot');
                }
            }
            
            // ارسال به GPT-4 API
            async function sendToGPT4(message) {
                try {
                    const response = await fetch(`https://gpt4.api-sina-free.workers.dev/gpt4?text=${encodeURIComponent(message)}`);
                    const data = await response.json();
                    
                    // نمایش پاسخ
                    addMessage(data.result || data.Result || 'پاسخی دریافت نشد.', 'bot');
                } catch (error) {
                    console.error('خطا در ارتباط با GPT-4:', error);
                    addMessage('متأسفانه در ارتباط با سرور مشکلی پیش آمده. لطفاً دوباره تلاش کنید.', 'bot');
                }
            }
            
            // تولید پاسخ محلی برای حالت‌های دیگر
            function generateLocalResponse(message) {
                let response = '';
                
                if (currentMode === 'creative') {
                    const creativeResponses = [
                        `از سوال جالب شما متشکرم! از دیدگاه خلاقانه، ${message} می‌تواند به روش‌های مختلفی تفسیر شود.`,
                        `چه سوال الهام‌بخشی! به عنوان یک هوش مصنوعی خلاق، فکر می‌کنم ${message} فرصتی برای نوآوری است.`,
                        `دیدگاه جالبی دارید! از زاویه خلاقانه، ${message} می‌تواند دریچه‌ای به سوی ایده‌های جدید باشد.`,
                        `سوال شما مرا به فکر واداشت! در حالت خلاقانه، ${message} را می‌توان به شکل هنری و نوآورانه‌ای بررسی کرد.`
                    ];
                    response = creativeResponses[Math.floor(Math.random() * creativeResponses.length)];
                } else if (currentMode === 'precise') {
                    const preciseResponses = [
                        `بر اساس تحلیل دقیق، سوال "${message}" نیاز به بررسی جزئیات دارد.`,
                        `در حالت دقیق، باید به تمام جوانب سوال "${message}" توجه کرد.`,
                        `از دیدگاه تحلیلی، "${message}" را می‌توان به بخش‌های کوچکتر تقسیم و دقیقاً بررسی کرد.`,
                        `به عنوان یک دستیار دقیق، سوال "${message}" را با جزئیات کامل بررسی خواهم کرد.`
                    ];
                    response = preciseResponses[Math.floor(Math.random() * preciseResponses.length)];
                }
                
                addMessage(response, 'bot');
            }
            
            // اضافه کردن پیام به چت
            function addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
                
                const messageContent = document.createElement('div');
                messageContent.textContent = text;
                messageDiv.appendChild(messageContent);
                
                const timeDiv = document.createElement('div');
                timeDiv.classList.add('message-time');
                timeDiv.textContent = getCurrentTime();
                messageDiv.appendChild(timeDiv);
                
                chatArea.appendChild(messageDiv);
                scrollToBottom();
            }
            
            // نمایش نشانگر تایپ
            function showTypingIndicator() {
                typingIndicator.style.display = 'block';
                scrollToBottom();
            }
            
            // پنهان کردن نشانگر تایپ
            function hideTypingIndicator() {
                typingIndicator.style.display = 'none';
            }
            
            // اسکرول به پایین چت
            function scrollToBottom() {
                chatArea.scrollTop = chatArea.scrollHeight;
            }
            
            // دریافت زمان فعلی
            function getCurrentTime() {
                const now = new Date();
                return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            }
            
            // دریافت نام حالت
            function getModeName(mode) {
                const modeNames = {
                    'gpt4': 'GPT-4',
                    'copilot': 'Copilot',
                    'creative': 'خلاقانه',
                    'precise': 'دقیق'
                };
                return modeNames[mode] || mode;
            }
            
            // تنظیم حالت اولیه
            chatContainer.classList.add('gpt4-mode');
        });
    </script>
</body>
</html>
